version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hw8-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hw8-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for other containers (using the name "kafka"),
      # one for your Mac's own terminal/venv scripts (using "localhost").
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  worker:
    build:
      context: ./code/messaging
    container_name: hw8-worker
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
    command: ["python", "worker.py"]

  api:
    build:
      context: ./code/messaging
    container_name: hw8-api
    depends_on:
      - kafka
      - worker
    ports:
      - "8425:8425"
    environment:
      KAFKA_BROKER: kafka:29092
      PORT_BASE: "8425"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8425"]

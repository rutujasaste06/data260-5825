<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinical Trial Registry - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinical Trial Registry</a>
        <div>
            {% if user %}
                <span class="navbar-text text-white me-3">Logged in as {{ user }}</span>
                <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
                <a class="btn btn-light btn-sm" href="/logout">Logout</a>
            {% else %}
                <a class="btn btn-light btn-sm" href="/login">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-5">
    {% block content %}{% endblock %}
</div>

</body>
</html>

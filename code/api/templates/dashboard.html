{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<div class="card p-4">
    <h1>Welcome, {{ user }}</h1>
    <p class="lead">This is your protected dashboard. Only logged-in users can see this page.</p>
    <a class="btn btn-outline-secondary" href="/logout">Log out</a>
</div>

<script>

    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>

{% endblock %}

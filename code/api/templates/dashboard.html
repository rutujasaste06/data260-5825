{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<div class="card p-4">
    <h1>Welcome, {{ user }}</h1>
    <p class="lead">This is your protected dashboard. Only logged-in users can see this page.</p>
    <a class="btn btn-outline-secondary" href="/logout">Log out</a>
</div>

<script>
    // If this page is being shown from the browser's back-forward cache
    // (a saved snapshot, not a fresh request), force a real reload so the
    // server re-checks the session instead of showing stale content.
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>

{% endblock %}

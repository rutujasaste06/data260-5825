  - {id: S04, query: "What are the eligibility requirements for a Phase III trial?"}
  - {id: S05, query: "How long does a typical Phase III clinical trial last?"}
  - {id: S06, query: "What is a placebo in a clinical trial?"}
  - {id: S07, query: "What is the purpose of an NCT number on a trial listing?"}
  - {id: S08, query: "Can a participant withdraw from a clinical trial at any time?"}
  - {id: S09, query: "What is a double-blind clinical trial?"}
  - {id: S10, query: "Who reviews and approves a clinical trial before it starts?"}


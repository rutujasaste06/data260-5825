# HW9 Part 3.1 - labeled test set for the semantic cache (domain: clinical trial listings)
#
# Written and committed BEFORE any threshold sweep. Labels must not be edited after
# results are seen; any labeling mistake is documented separately in the report.
#
# How it works: the cache is first filled with the 10 "seed" questions below (answered by
# the HW8 agent). Each of the 40 cases is then sent as an incoming query.
#   should_hit: true  -> an ideal cache returns the seed's saved answer
#   should_hit: false -> an ideal cache must miss and run the agent
# A "false hit" = the cache answers a should_hit:false case from a saved answer.

seeds:
